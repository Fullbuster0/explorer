<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shazoes Explorer — Cosmos Blockchain Explorer</title>
    <meta
      name="description"
      content="Shazoes Explorer is a multi-chain Cosmos SDK block explorer by Shazoes Validator — Cosmos Hub, AtomOne, Babylon, MANTRA, Terra and more."
    />
    <!-- Default OG/Twitter (bots get per-route tags via /api/og — see vercel.json) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shazoes Explorer" />
    <meta property="og:title" content="Shazoes Explorer — Cosmos Blockchain Explorer" />
    <meta
      property="og:description"
      content="Multi-chain Cosmos SDK block explorer by Shazoes Validator — Cosmos Hub, AtomOne, Babylon, MANTRA, Terra and more."
    />
    <meta property="og:url" content="https://shazoes-explorer.vercel.app/" />
    <meta property="og:image" content="https://shazoes-explorer.vercel.app/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Shazoes Explorer — Cosmos Blockchain Explorer" />
    <meta
      name="twitter:description"
      content="Multi-chain Cosmos SDK block explorer by Shazoes Validator."
    />
    <meta name="twitter:image" content="https://shazoes-explorer.vercel.app/logo.png" />
    <link rel="stylesheet" type="text/css" href="/loader.css" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://at.alicdn.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https: http: data:; frame-src 'self' https://wallet.keplr.app; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com https://at.alicdn.com;"
    />
  </head>
  <body>
    <div id="app">
      <!-- First-paint splash: clean spinner only (no brand logo) -->
      <div id="loading-bg" role="status" aria-label="Loading">
        <div class="sz-boot-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <!-- ping-pub wallet/tx web-components: Connect Wallet, Send, Delegate, Swap.
         Distinct from the removed /widget route (sidebar module). Keep this. -->
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@ping-pub/widget@0.3.12/dist/widget.min.js"
      integrity="sha384-qKDWL/dPjkTzqn43/+vE52grvtXBgPxy7lPW+vxnjpOn9zJuHiu4DJ2TR3FrlPB5"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
