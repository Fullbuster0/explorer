<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Shazoes monogram S — dual-tone ribbon style, sharp vector -->
  <defs>
    <linearGradient id="szTop" x1="30" y1="16" x2="100" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1B4A"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="szBot" x1="28" y1="64" x2="100" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>
  </defs>
  <!-- Upper bowl (navy → blue) -->
  <path
    d="M96 30
       C 90 18, 70 14, 54 20
       C 34 28, 28 48, 42 58
       C 50 64, 58 64, 66 68"
    fill="none"
    stroke="url(#szTop)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Lower bowl (sky blue) -->
  <path
    d="M58 64
       C 68 68, 76 72, 82 80
       C 94 96, 86 114, 66 116
       C 48 118, 34 108, 32 94"
    fill="none"
    stroke="url(#szBot)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Terminal dots (eye accents) -->
  <circle cx="96" cy="30" r="4.5" fill="#42A5F5"/>
  <circle cx="32" cy="94" r="4.5" fill="#0D1B4A"/>
</svg>
